<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Key Detection</title>
  <script type="text/javascript" src="./cornify.js"></script>
  <link rel="icon" href="https://fav.farm/✅" />
</head>

<body>
  <script>
    const pressed = [];
    const secretCode = "wesbos";

    window.addEventListener("keyup", (e) => {
      console.log(e.key);
      pressed.push(e.key);
      pressed.splice(
        -secretCode.length - 1, //Starts from the end and the -1 is so the first character can also be removed
        pressed.length - secretCode.length //characters remaining to be deleted
      );
      if (pressed.join("").includes(secretCode)) {
        console.log("DING DING!");
        cornify_add();
      }
      console.log(pressed);
    });
  </script>
</body>

</html>
